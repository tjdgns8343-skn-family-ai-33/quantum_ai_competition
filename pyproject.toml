[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ai-competition"
version = "0.1.0"
description = "Competition-compliant, circuit-native QML training pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "qiskit==2.2.3",
  "qiskit-machine-learning==0.9.0",
  # audit-artifact reloads the submitted QASM 3 to check it against the rules;
  # without this the compliance gate cannot run at all.
  "qiskit-qasm3-import>=0.5,<1",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
qcompetition = "qchallenge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

